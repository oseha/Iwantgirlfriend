<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>기사 성준의 미로 대모험</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    overflow:hidden;
    font-family:"Malgun Gothic",sans-serif;
    background:linear-gradient(#07111f,#1b3a57,#3d6b75);
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
}


/* 제목 화면 */

.container{
    text-align:center;
    z-index:5;
}


h1{
    font-size:65px;
    color:#ffd700;
    text-shadow:
    0 0 10px orange,
    0 0 30px gold;

    margin-bottom:20px;
}


h2{
    font-size:35px;
    margin-bottom:25px;
}


p{
    font-size:22px;
    line-height:1.8;
    margin-bottom:40px;
}


/* 게임 버튼 */

button{

    padding:20px 60px;

    font-size:30px;

    font-weight:bold;

    border:none;

    border-radius:50px;

    background:#ffd700;

    cursor:pointer;

    transition:0.3s;

}


button:hover{

    background:#ff9900;

    transform:scale(1.1);

}



/* 기사 */

.knight{

    position:absolute;

    left:80px;

    bottom:80px;

    font-size:120px;

    animation:moveKnight 2s infinite alternate;

}


/* 성 */

.castle{

    position:absolute;

    right:70px;

    bottom:60px;

    font-size:150px;

}


/* 공주 */

.princess{

    position:absolute;

    right:120px;

    bottom:190px;

    font-size:65px;

}



/* 구름 */

.cloud{

    position:absolute;

    font-size:70px;

    opacity:0.7;

    animation:cloudMove 15s infinite linear;

}



@keyframes moveKnight{

    from{
        transform:translateX(0);
    }

    to{
        transform:translateX(40px);
    }

}



@keyframes cloudMove{

    from{
        left:-200px;
    }

    to{
        left:100%;
    }

}


/* 별 */

.star{

    position:absolute;

    color:white;

    animation:blink 2s infinite alternate;

}


@keyframes blink{

    from{
        opacity:0.3;
    }

    to{
        opacity:1;
    }

}


</style>

</head>


<body>


<div class="cloud" style="top:80px;">☁️</div>


<div class="star" style="left:15%;top:15%;font-size:25px;">
⭐
</div>

<div class="star" style="left:75%;top:10%;font-size:30px;">
✨
</div>


<div class="star" style="left:50%;top:25%;font-size:20px;">
⭐
</div>



<!-- 기사 -->

<div class="knight">
🛡️⚔️
</div>



<!-- 성 -->

<div class="castle">
🏰
</div>


<!-- 공주 -->

<div class="princess">
👸
</div>




<div class="container">


<h1>
⚔️ 기사 성준의 미로 대모험 ⚔️
</h1>


<h2>
👑 공주를 구출하라!
</h2>


<p>

용감한 기사 <b>성준</b>은<br>

어둠 속 미로를 지나<br>

마왕에게 붙잡힌 공주를 구해야 합니다.<br><br>


수많은 장애물과 위험을 극복하고<br>

공주에게 도착하세요!

</p>



<button onclick="startGame()">
🎮 게임 시작
</button>


</div>




<script>


function startGame(){

    location.href="main.html";

}


</script>



</body>
</html>
