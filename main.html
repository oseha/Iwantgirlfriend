<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">
<title>기사 성준의 미로 대모험</title>


<style>


*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}



body{

    height:100vh;

    background:
    linear-gradient(#020024,#090979,#00d4ff);

    color:white;

    font-family:"Malgun Gothic",sans-serif;

    display:flex;

    justify-content:center;

    align-items:center;

}



.container{

    width:850px;

    background:rgba(0,0,0,0.55);

    padding:50px;

    border-radius:40px;

    border:5px solid gold;

    text-align:center;

    box-shadow:0 0 50px black;

}



h1{

    font-size:55px;

    color:#ffd700;

    text-shadow:

    0 0 15px orange,

    0 0 30px red;

    margin-bottom:30px;

}



.story{

    font-size:25px;

    line-height:1.8;

    margin-bottom:40px;

}



.character{

    font-size:90px;

    margin-bottom:20px;

}



.buttons button{


    display:block;

    width:300px;

    margin:20px auto;

    padding:18px;

    border:none;

    border-radius:40px;

    font-size:28px;

    font-weight:bold;

    cursor:pointer;

    background:gold;

    transition:0.3s;


}



.buttons button:hover{

    transform:scale(1.1);

    background:orange;

}



.back{

    position:absolute;

    left:60px;

    bottom:50px;

    font-size:100px;

}



.castle{

    position:absolute;

    right:60px;

    bottom:40px;

    font-size:150px;

}



</style>


</head>


<body>



<div class="back">

⚔️🛡️

</div>



<div class="castle">

🏰

</div>



<div class="container">



<div class="character">

👑⚔️👸

</div>



<h1>

기사 성준의 미로 대모험

</h1>



<div class="story">


용감한 기사 <b>성준</b>은<br>

위험한 미로를 통과하여<br>

마왕에게 붙잡힌 공주를 구출해야 합니다.<br><br>


모험을 시작하거나<br>

게임 정보를 확인해보세요!

</div>




<div class="buttons">


<button onclick="goEarth()">

🌍 지진모델링

</button>



<button onclick="goExplain()">

📖 게임 설명

</button>



<button onclick="startGame()">

🎮 게임 시작

</button>



</div>



</div>



<script>


function goEarth(){

    location.href="earth.html";

}



function goExplain(){

    location.href="gamestyle.html";

}



function startGame(){

    location.href="game.html";

}



</script>



</body>

</html>
