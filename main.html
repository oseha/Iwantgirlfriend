<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>기사 성준의 미로 대모험</title>

<style>
body{
    margin:0;
    background:linear-gradient(#05001a,#16213e);
    color:white;
    text-align:center;
    font-family:"Malgun Gothic";
}

h1{
    color:gold;
    font-size:45px;
    text-shadow:0 0 20px orange;
}

#info{
    font-size:25px;
    margin:10px;
}

#maze{
    margin:auto;
    display:grid;
    grid-template-columns:repeat(12,55px);
    grid-template-rows:repeat(12,55px);
    width:660px;
    border:8px solid gold;
}

.cell{
    width:55px;
    height:55px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:35px;
}

.wall{
    background:#333;
    border:2px solid #666;
}

.floor{
    background:#cbb994;
}

.player{
    background:#008000;
}

.goal{
    background:#ffd700;
}

.monster{
    background:#800000;
}

.item{
    background:#ff69b4;
}

button{
    margin-top:20px;
    padding:15px 40px;
    font-size:22px;
    border-radius:30px;
    background:gold;
    border:0;
}

</style>
</head>

<body>

<audio autoplay loop>
<source src="music.mp3">
</audio>


<h1>⚔️ 기사 성준의 미로 대모험 ⚔️</h1>

<div id="info"></div>

<div id="maze"></div>

<button onclick="restart()">다시 시작</button>


<script>

let stage=1;

let hp=100;


let player={
x:1,
y:1
};


let monster={
x:8,
y:8
};


let boss=false;


let item={
x:5,
y:5,
active:true
};


let map=[];



function createMap(){


map=[];


for(let y=0;y<12;y++){

let row=[];

for(let x=0;x<12;x++){


if(
x==0||
y==0||
x==11||
y==11
){

row.push(1);

}

else if(Math.random()<0.25){

row.push(1);

}

else{

row.push(0);

}


}


map.push(row);

}



map[1][1]=0;


map[10][10]=2;



item.x=Math.floor(Math.random()*8)+2;
item.y=Math.floor(Math.random()*8)+2;
item.active=true;



}



function draw(){


let maze=document.getElementById("maze");

maze.innerHTML="";



for(let y=0;y<12;y++){

for(let x=0;x<12;x++){


let c=document.createElement("div");

c.className="cell";



if(player.x==x&&player.y==y){

c.classList.add("player");
c.innerHTML="⚔️";


}

else if(
stage>=5 &&
monster.x==x &&
monster.y==y
){

if(stage==20){

c.innerHTML="👿";

}else if(boss){

c.innerHTML="👺";

}else{

c.innerHTML="👹";

}

c.classList.add("monster");


}

else if(
item.active &&
item.x==x &&
item.y==y
){

c.classList.add("item");
c.innerHTML="💖";


}

else if(map[y][x]==1){

c.classList.add("wall");


}

else if(map[y][x]==2){

c.classList.add("goal");
c.innerHTML="👸";


}

else{

c.classList.add("floor");

}



maze.appendChild(c);


}


}



document.getElementById("info").innerHTML=
`
🏰 스테이지 : ${stage}/20 |
❤️ HP : ${hp}
`;

}



function damage(){


hp-=20;


if(hp<=0){

alert("💀 기사 성준이 쓰러졌습니다!");

restart();

}


}



function moveMonster(){


if(stage<5)return;



let dx=player.x-monster.x;
let dy=player.y-monster.y;



if(Math.abs(dx)>Math.abs(dy)){

monster.x+=dx>0?1:-1;

}

else{

monster.y+=dy>0?1:-1;

}



if(
player.x==monster.x &&
player.y==monster.y
){

damage();

}


}



document.addEventListener(
"keydown",
function(e){


let nx=player.x;
let ny=player.y;



if(e.key=="ArrowRight")nx++;
if(e.key=="ArrowLeft")nx--;
if(e.key=="ArrowUp")ny--;
if(e.key=="ArrowDown")ny++;



if(
nx<0||
ny<0||
nx>=12||
ny>=12
)return;



if(map[ny][nx]==1)return;



player.x=nx;
player.y=ny;



// 아이템

if(
item.active &&
player.x==item.x &&
player.y==item.y
){

hp=Math.min(100,hp+30);

item.active=false;

alert("💖 체력을 회복했습니다!");

}



// 몬스터 충돌

if(
stage>=5 &&
player.x==monster.x &&
player.y==monster.y
){

damage();

}




// 공주

if(map[ny][nx]==2){


if(stage<20){

stage++;

alert(
"🎉 다음 스테이지!"
);

hp=Math.min(100,hp+10);

createMap();

player.x=1;
player.y=1;


if(stage>=10){

boss=true;

}else{

boss=false;

}



}

else{

alert(
"👑 축하합니다!\n기사 성준이 공주를 구출했습니다!"
);

location.href="index.html";

}


}



draw();


});





function restart(){

stage=1;
hp=100;
boss=false;

createMap();

player.x=1;
player.y=1;

draw();

}



setInterval(
function(){

moveMonster();

draw();

},
1000
);



createMap();

draw();


</script>

</body>
</html>
