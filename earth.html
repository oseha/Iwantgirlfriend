<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>세계 지진 모델링</title>

<style>

body{
    margin:0;
    overflow:hidden;
    background:black;
}


#world{

    width:100vw;
    height:100vh;

    position:relative;

    background-image:url("worldmap.png");

    background-size:100% 100%;

    background-repeat:no-repeat;

    background-position:center;

}


/* 제목 */

#title{

position:absolute;

top:20px;

left:50%;

transform:translateX(-50%);

color:white;

font-size:35px;

font-weight:bold;

background:rgba(0,0,0,0.6);

padding:15px 30px;

border-radius:15px;

}



/* 지진 표시 */

.quake{

position:absolute;

width:22px;

height:22px;

background:red;

border-radius:50%;

box-shadow:
0 0 20px red;

animation:shake 1s infinite;

}



@keyframes shake{

0%{
transform:scale(1);
}

50%{
transform:scale(1.8);
}

100%{
transform:scale(1);
}

}



#info{

position:absolute;

bottom:20px;

left:20px;

color:white;

background:rgba(0,0,0,0.7);

padding:15px;

font-size:20px;

border-radius:10px;

}


</style>

</head>


<body>


<div id="world">


<div id="title">
🌎 세계 지진 발생 모델링
</div>



<!-- 지진 발생 위치 -->

<!-- 일본 -->

<div class="quake"
style="left:76%;top:43%;">
</div>


<!-- 인도네시아 -->

<div class="quake"
style="left:75%;top:57%;">
</div>


<!-- 칠레 -->

<div class="quake"
style="left:30%;top:65%;">
</div>


<!-- 미국 서부 -->

<div class="quake"
style="left:22%;top:43%;">
</div>


<!-- 터키 -->

<div class="quake"
style="left:60%;top:40%;">
</div>



<div id="info">

🔴 빨간 점 = 지진 발생 지역<br>
🌍 배경 = 사용자가 제공한 세계지도<br>
🌋 판 경계 주변 주요 지진 지역 표시

</div>



</div>



</body>
</html>
