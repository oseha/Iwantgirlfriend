<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>세계 지진 모델링</title>

<style>

body{
    margin:0;
    overflow:hidden;
    font-family:"Malgun Gothic";
    background:white;
}


/* 세계지도 */

#map{

    width:100vw;
    height:100vh;

    position:relative;

    background-image:url("https://upload.wikimedia.org/wikipedia/commons/8/80/World_map_-_low_resolution.svg");

    background-size:cover;

    background-position:center;

    background-repeat:no-repeat;

}



/* 제목 */

#title{

    position:absolute;

    top:20px;

    left:50%;

    transform:translateX(-50%);

    font-size:36px;

    font-weight:bold;

    color:black;

    background:rgba(255,255,255,0.8);

    padding:15px 30px;

    border-radius:15px;

}



/* 지진 */

.quake{

    position:absolute;

    background:red;

    border-radius:50%;

    box-shadow:
    0 0 20px red;

    animation:pulse 1.5s infinite;

}



@keyframes pulse{

    0%{

        transform:scale(1);

        opacity:1;

    }


    50%{

        transform:scale(2);

        opacity:0.5;

    }


    100%{

        transform:scale(1);

        opacity:1;

    }

}



/* 정보창 */

.info{

    position:absolute;

    background:white;

    color:black;

    border:2px solid red;

    padding:8px;

    border-radius:10px;

    font-size:16px;

}



#legend{

    position:absolute;

    bottom:20px;

    left:20px;

    background:white;

    padding:15px;

    border-radius:10px;

    font-size:18px;

    border:2px solid black;

}


</style>

</head>


<body>


<div id="map">


<div id="title">
🌎 세계 지진 발생 모델링
</div>



<!-- 일본 -->

<div class="quake"
style="
left:82%;
top:43%;
width:30px;
height:30px;">
</div>


<div class="info"
style="
left:82%;
top:36%;">
🇯🇵 일본<br>
규모 7.2
</div>




<!-- 인도네시아 -->

<div class="quake"
style="
left:76%;
top:58%;
width:25px;
height:25px;">
</div>


<div class="info"
style="
left:70%;
top:62%;">
🇮🇩 인도네시아<br>
규모 6.8
</div>





<!-- 칠레 -->

<div class="quake"
style="
left:30%;
top:66%;
width:40px;
height:40px;">
</div>


<div class="info"
style="
left:25%;
top:72%;">
🇨🇱 칠레<br>
규모 8.0
</div>





<!-- 미국 -->

<div class="quake"
style="
left:22%;
top:43%;
width:22px;
height:22px;">
</div>


<div class="info"
style="
left:15%;
top:37%;">
🇺🇸 미국 서부<br>
규모 6.5
</div>





<!-- 터키 -->

<div class="quake"
style="
left:60%;
top:40%;
width:26px;
height:26px;">
</div>


<div class="info"
style="
left:55%;
top:34%;">
🇹🇷 터키<br>
규모 7.0
</div>




<div id="legend">

🔴 빨간 원 : 지진 발생 위치<br>
⭕ 원 크기 : 지진 규모<br>
🌎 세계 지진 지도 모델

</div>



</div>


</body>
</html>
