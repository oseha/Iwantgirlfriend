<!DOCTYPE html>
<html lang="ko">
<head>

<meta charset="UTF-8">
<title>세계 지진 모델링</title>

<style>

body{
margin:0;
overflow:hidden;
font-family:"Malgun Gothic";
}


#map{

width:100vw;
height:100vh;

background-image:url("https://upload.wikimedia.org/wikipedia/commons/8/80/World_map_-_low_resolution.svg");

background-size:cover;
background-position:center;

position:relative;

}



#title{

position:absolute;

top:20px;
left:50%;

transform:translateX(-50%);

background:white;

padding:15px 30px;

border-radius:15px;

font-size:32px;

font-weight:bold;

z-index:10;

}



/* 지진 점 */

.quake{

position:absolute;

background:red;

border-radius:50%;

box-shadow:
0 0 20px red;

animation:pulse 1.5s infinite;

cursor:pointer;

}



@keyframes pulse{

50%{

transform:scale(1.8);

opacity:.5;

}

}



/* 설명창 */

#info{

position:absolute;

right:20px;

bottom:20px;

width:300px;

background:white;

padding:15px;

border-radius:15px;

font-size:18px;

border:3px solid red;

display:none;

z-index:20;

}



#list{

position:absolute;

left:20px;

bottom:20px;

background:white;

padding:15px;

border-radius:15px;

font-size:16px;

max-height:250px;

overflow:auto;

z-index:10;

}


</style>

</head>


<body>


<div id="map">


<div id="title">
🌎 세계 지진 발생 모델링
</div>


</div>



<div id="info"></div>

<div id="list">

<b>최근 주요 지진</b>

<br>

불러오는 중...

</div>



<script>


let map=document.getElementById("map");

let info=document.getElementById("info");

let list=document.getElementById("list");




// 과거 20년 주요 지진

let historic=[


{
name:"🇯🇵 일본 도호쿠 대지진",
year:"2011",
mag:9.1,
x:82,
y:43,
desc:"2011년 발생. 거대한 쓰나미를 발생시킨 초대형 지진"
},


{
name:"🇨🇱 칠레 지진",
year:"2010",
mag:8.8,
x:30,
y:66,
desc:"세계에서 가장 강력한 지진 중 하나"
},


{
name:"🇹🇷 튀르키예 지진",
year:"2023",
mag:7.8,
x:60,
y:40,
desc:"대규모 피해를 발생시킨 강진"
},


{
name:"🇳🇿 뉴질랜드 지진",
year:"2016",
mag:7.8,
x:86,
y:67,
desc:"뉴질랜드 남섬 부근 발생"
},


{
name:"🇲🇲 미얀마 지진",
year:"2025",
mag:7.7,
x:72,
y:52,
desc:"강한 흔들림이 발생한 대형 지진"
}


];



function addEarthquake(e){


let dot=document.createElement("div");


dot.className="quake";


let size=e.mag*4;


dot.style.width=size+"px";

dot.style.height=size+"px";


dot.style.left=e.x+"%";

dot.style.top=e.y+"%";



dot.onclick=function(){


info.style.display="block";


info.innerHTML=

"<h3>"+e.name+"</h3>"+

"발생년도 : "+e.year+
"<br>"+

"규모 : M"+e.mag+
"<br><br>"+

e.desc;



};



map.appendChild(dot);



}



historic.forEach(addEarthquake);





// 실시간 지진 불러오기


function realTime(){


fetch(
"https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_day.geojson"
)


.then(r=>r.json())


.then(data=>{


list.innerHTML="<b>최근 실시간 지진</b><br>";



data.features.slice(0,10).forEach(q=>{


let p=q.properties;


let c=q.geometry.coordinates;



let name=p.place;

let mag=p.mag;



list.innerHTML+=

"🌋 "+name+
"<br>규모 M"+mag+
"<br><br>";



let dot=document.createElement("div");

dot.className="quake";


let size=Math.max(10,mag*3);


dot.style.width=size+"px";

dot.style.height=size+"px";



// 경도, 위도를 화면 위치로 변환

dot.style.left=((c[0]+180)/360*100)+"%";


dot.style.top=((90-c[1])/180*100)+"%";



dot.onclick=function(){


info.style.display="block";


info.innerHTML=

"<h3>"+name+"</h3>"+
"규모 : M"+mag+
"<br>"+
"실시간 USGS 데이터";


};



map.appendChild(dot);



});


});


}



realTime();


// 10분마다 갱신

setInterval(realTime,600000);



</script>


</body>
</html>
