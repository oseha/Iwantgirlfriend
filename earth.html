<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>세계 지진 모델링</title>

<style>

body{
    margin:0;
    overflow:hidden;
    background:black;
}


#map{

    width:100vw;
    height:100vh;

    position:relative;

    background-image:url("image.png");

    background-size:cover;

    background-position:center;

    background-repeat:no-repeat;

}



/* 제목 */

#title{

position:absolute;

top:20px;
left:50%;

transform:translateX(-50%);

font-size:35px;

font-weight:bold;

color:white;

background:rgba(0,0,0,0.65);

padding:15px 30px;

border-radius:15px;

}



/* 지진 발생 표시 */

.quake{

position:absolute;

width:22px;

height:22px;

background:red;

border-radius:50%;

box-shadow:
0 0 20px red;

animation:pulse 1s infinite;

}


@keyframes pulse{

0%{
transform:scale(1);
}

50%{
transform:scale(1.8);
}

100%{
transform:scale(1);
}

}



/* 설명 */

#info{

position:absolute;

bottom:20px;

left:20px;

color:white;

background:rgba(0,0,0,0.7);

padding:15px;

font-size:20px;

border-radius:10px;

}

</style>

</head>


<body>


<div id="map">


<div id="title">
🌎 세계 지진 발생 모델링
</div>


<!-- 지진 위치 -->


<!-- 미국 서부 -->

<div class="quake"
style="left:22%;top:43%;">
</div>


<!-- 일본 -->

<div class="quake"
style="left:83%;top:45%;">
</div>


<!-- 인도네시아 -->

<div class="quake"
style="left:78%;top:60%;">
</div>


<!-- 칠레 -->

<div class="quake"
style="left:30%;top:67%;">
</div>


<!-- 터키 -->

<div class="quake"
style="left:61%;top:40%;">
</div>


<!-- 알래스카 -->

<div class="quake"
style="left:18%;top:28%;">
</div>



<div id="info">

🔴 빨간 점 : 지진 발생 지역<br>
🌋 판 경계 주변 주요 지진 표시<br>
🌎 USGS 지도 기반 모델

</div>



</div>


</body>
</html>
