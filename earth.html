<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>세계 지진 모델링</title>

<style>

body{
    margin:0;
    overflow:hidden;
    background:#ccc;
}


#map{

    width:100vw;
    height:100vh;

    background-image:url("./worldmap.png");

    background-size:contain;

    background-repeat:no-repeat;

    background-position:center;

    background-color:#ccc;

    position:relative;

}



/* 제목 */

#title{

position:absolute;

top:20px;

left:50%;

transform:translateX(-50%);

font-size:35px;

color:white;

background:rgba(0,0,0,0.6);

padding:15px 30px;

border-radius:15px;

}



/* 지진 표시 */

.quake{

position:absolute;

width:20px;

height:20px;

background:red;

border-radius:50%;

box-shadow:
0 0 20px red;

animation:pulse 1s infinite;

}



@keyframes pulse{

0%{
scale:1;
}

50%{
scale:1.8;
}

100%{
scale:1;
}

}



/* 설명 */

#info{

position:absolute;

bottom:20px;

left:20px;

background:rgba(0,0,0,0.7);

color:white;

font-size:20px;

padding:15px;

border-radius:10px;

}


</style>

</head>


<body>


<div id="map">


<div id="title">
🌎 세계 지진 모델링
</div>



<!-- 지진 위치 -->


<div class="quake"
style="left:53%;top:43%;">
</div>


<div class="quake"
style="left:76%;top:48%;">
</div>


<div class="quake"
style="left:31%;top:55%;">
</div>


<div class="quake"
style="left:68%;top:38%;">
</div>



<div id="info">

🔴 빨간 점 : 지진 발생 위치<br>
🌍 네가 제공한 세계지도 사용

</div>



</div>



</body>
</html>
