<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>실시간 세계 지진 지도</title>

<style>

body{
    margin:0;
    overflow:hidden;
    font-family:"Malgun Gothic";
}


#map{

    width:100vw;
    height:100vh;

    position:relative;

    background-image:url("https://upload.wikimedia.org/wikipedia/commons/8/80/World_map_-_low_resolution.svg");

    background-size:cover;

    background-position:center;

    background-repeat:no-repeat;
}


/* 제목 */

#title{

    position:absolute;

    top:20px;

    left:50%;

    transform:translateX(-50%);

    background:white;

    padding:15px 30px;

    border-radius:15px;

    font-size:32px;

    font-weight:bold;

    z-index:10;

}



/* 지진 점 */

.quake{

    position:absolute;

    background:red;

    border-radius:50%;

    box-shadow:
    0 0 20px red;

    animation:pulse 1.5s infinite;

    cursor:pointer;

}



@keyframes pulse{

    0%{
        transform:scale(1);
        opacity:1;
    }

    50%{
        transform:scale(2);
        opacity:0.5;
    }

    100%{
        transform:scale(1);
        opacity:1;
    }

}



#info{

    position:absolute;

    right:20px;

    bottom:20px;

    width:330px;

    background:white;

    padding:15px;

    border-radius:15px;

    border:3px solid red;

    display:none;

    font-size:18px;

    z-index:20;

}



#list{

    position:absolute;

    left:20px;

    bottom:20px;

    width:320px;

    max-height:300px;

    overflow:auto;

    background:white;

    padding:15px;

    border-radius:15px;

    font-size:15px;

    z-index:20;

}

</style>

</head>

<body>


<div id="map">

<div id="title">
🌎 실시간 세계 지진 지도
</div>

</div>


<div id="info"></div>

<div id="list">
데이터 불러오는 중...
</div>
