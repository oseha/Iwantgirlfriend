<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>세계 지도 모델링</title>

<style>

body{
    margin:0;
    overflow:hidden;
    background:black;
    font-family:"Malgun Gothic";
}


/* 세계지도 배경 */

#map{

    width:100vw;
    height:100vh;

    background-image:url("worldmap.png");

    background-size:cover;

    background-position:center;

    position:relative;

}



/* 제목 */

#title{

    position:absolute;

    top:20px;

    left:30px;

    color:white;

    font-size:35px;

    text-shadow:3px 3px 5px black;

}



/* 지진 표시 점 */

.earthquake{

    width:18px;

    height:18px;

    background:red;

    border-radius:50%;

    position:absolute;

    box-shadow:
    0 0 15px red;

    animation:pulse 1s infinite;

}



@keyframes pulse{

0%{
transform:scale(1);
}

50%{
transform:scale(1.5);
}

100%{
transform:scale(1);
}

}



/* 설명창 */

#info{

position:absolute;

bottom:20px;

left:20px;

background:rgba(0,0,0,0.7);

color:white;

padding:15px;

border-radius:10px;

font-size:20px;

}



</style>

</head>


<body>


<div id="map">


<div id="title">
🌎 세계 지진 모델링 지도
</div>



<!-- 지진 위치 -->


<div class="earthquake"
style="left:52%; top:42%;">
</div>


<div class="earthquake"
style="left:76%; top:48%;">
</div>


<div class="earthquake"
style="left:34%; top:55%;">
</div>


<div class="earthquake"
style="left:65%; top:35%;">
</div>



<div id="info">

🔴 빨간 점 : 지진 발생 위치<br>

🌍 세계 주요 지진대 표시<br>

마우스로 지도를 확대해서 확인 가능

</div>


</div>



<script>


// 마우스 확대 기능


let map=document.getElementById("map");


let scale=1;



map.addEventListener("wheel",function(e){


e.preventDefault();


if(e.deltaY<0){

scale+=0.1;

}

else{

scale-=0.1;

}



if(scale<1)
scale=1;


if(scale>3)
scale=3;



map.style.backgroundSize=
(scale*100)+"%";


});



</script>


</body>
</html>
